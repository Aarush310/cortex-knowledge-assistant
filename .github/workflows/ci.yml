name: CI — Tests & Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Tests use a fake Claude client, so no API key is needed.
      - name: Run unit tests
        run: pytest -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cortex:ci .

      # OpenShift starts containers with a random UID in group 0.
      # Running the same way here proves the image doesn't need root.
      # A dummy key is enough for the app to start; no API call is made.
      - name: Start container as a random non-root user
        run: docker run -d --name cortex -p 8501:8501 --user 1000870000:0 -e ANTHROPIC_API_KEY=dummy cortex:ci

      - name: Wait for the health check
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8501/_stcore/health; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs cortex
          exit 1

      - name: Container logs
        if: always()
        run: docker logs cortex || true
